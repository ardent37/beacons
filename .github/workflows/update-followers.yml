name: Actualizar seguidores

on:
  schedule:
    - cron: "*/30 * * * *" # cada 30 minutos (GitHub puede retrasarlo un poco)
  workflow_dispatch: # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: followers
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Consultar TikTok + Instagram
        run: node scripts/update-followers.mjs

      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/followers.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar seguidores"
            git push
          fi
