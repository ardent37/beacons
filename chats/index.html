<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Salty · Chats</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <style>
    :root { --bg: #fff; --ink: #111; --muted: #888; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #2e2d2d; --ink: #fff; --muted: #bbb; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .spin {
      width: 34px; height: 34px; margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid rgb(252 117 20 / 0.2);
      border-top-color: #fc7514;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <!-- Respaldo: normalmente el botón de la web ya lleva directo a Telegram -->
  <div>
    <div class="spin" aria-hidden="true"></div>
    <p>Abriendo…</p>
  </div>

  <script src="links.js"></script>
  <script>
    SaltyChats.getCountry(2500).then(function (country) {
      location.replace(SaltyChats.linkFor(country));
    });
    // Al volver a esta pestaña (p. ej. desde la app de Telegram), mostrar la web
    addEventListener('pageshow', function (e) { if (e.persisted) location.replace('../'); });
  </script>
</body>
</html>
